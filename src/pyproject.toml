[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-agent"
version = "0.1.0"
description = "GAIA AI Agent"
requires-python = ">=3.12"

dependencies = [
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "smolagents>=1.0",
    "openpyxl>=3.1",
    "faster-whisper>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]